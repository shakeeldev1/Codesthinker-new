name: Keep Supabase Active

on:
  schedule:
    # Runs every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database via Backend API
        run: |
          curl -s -f https://codesthinker-backend.vercel.app/api/v1/ping || echo "Ping request sent to backend"
